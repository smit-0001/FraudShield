name: CI Pipeline

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your code from the repo
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Set up Python 3.10 environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest httpx  # Needed for testing

    # 4. Run the Tests
    # We use PYTHONPATH=. so pytest can see the 'app' folder
    - name: Run Tests
      run: |
        PYTHONPATH=. pytest
